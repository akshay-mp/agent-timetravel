version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"
      uv-non-breaking:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: google-adk
        update-types:
          - version-update:semver-major
      - dependency-name: pydantic-ai
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-security:
        applies-to: security-updates
        patterns:
          - "*"
      web-non-breaking:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: tailwind-merge
        update-types:
          - version-update:semver-major

  - package-ecosystem: bun
    directory: /web-demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-demo-security:
        applies-to: security-updates
        patterns:
          - "*"
      web-demo-non-breaking:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-non-breaking:
        update-types:
          - minor
          - patch
