name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/dist
          if-no-files-found: error

  packaging:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,adk,langgraph]' build twine
      - run: pytest tests --no-cov -m "not integration" -q
      - run: python scripts/packaging_smoke.py --artifacts dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-artifacts
          path: dist/*
          if-no-files-found: error
