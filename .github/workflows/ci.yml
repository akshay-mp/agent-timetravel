name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/dist
          if-no-files-found: error

  packaging:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install locked Python environment
        run: |
          python -m pip install --disable-pip-version-check "uv==0.11.7"
          uv sync --locked --extra dev --extra adk --extra langgraph --extra pydantic-ai
          uv venv .packaging-venv --python 3.11
          uv pip install --python .packaging-venv/bin/python "build==1.5.0" "twine==7.0.0"
      - run: uv run --no-sync pytest tests --no-cov -m "not integration" -q
      - run: .packaging-venv/bin/python scripts/packaging_smoke.py --artifacts dist
      - run: .packaging-venv/bin/python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: python-artifacts
          path: dist/*
          if-no-files-found: error

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
        working-directory: web-demo
      - run: bun test
        working-directory: web-demo
      - run: bunx tsc --noEmit
        working-directory: web-demo
      - run: bun run build
        working-directory: web-demo
