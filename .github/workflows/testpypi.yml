name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-to-testpypi to continue
        required: true
        type: string

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: testpypi-frontend-dist
          path: web/dist
          if-no-files-found: error

  build:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: testpypi-frontend-dist
          path: web/dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Require explicit TestPyPI confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "${CONFIRM}" != "publish-to-testpypi" ]; then
            echo "::error title=TestPyPI confirmation required::Set confirm to publish-to-testpypi."
            exit 1
          fi
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,adk,langgraph]' build twine
      - run: pytest tests --no-cov -m "not integration" -q
      - run: python scripts/packaging_smoke.py --artifacts dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: testpypi-python-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agent-timetravel
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: testpypi-python-artifacts
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
