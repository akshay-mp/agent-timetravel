name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: release-frontend-dist
          path: web/dist
          if-no-files-found: error

  build:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-frontend-dist
          path: web/dist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check tag matches project.version
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          PROJECT_VERSION="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          TAG_VERSION="${TAG_VERSION#v}"
          echo "Tag version: ${TAG_VERSION}"
          echo "Project version: ${PROJECT_VERSION}"
          if [ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]; then
            echo "::error title=Release version mismatch::Tag v${TAG_VERSION} does not match project.version ${PROJECT_VERSION}."
            exit 1
          fi
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,adk,langgraph]' build twine
      - run: pytest tests --no-cov -m 'not integration' -q
      - run: python scripts/packaging_smoke.py --artifacts dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: release-python-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-timetravel
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-python-artifacts
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
